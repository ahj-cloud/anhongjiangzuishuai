name: AnHongJiang
options:
  bundleIdPrefix: com.anhongjiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AnHongJiang:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AnHongJiang
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        INFOPLIST_FILE: AnHongJiang/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.anhongjiang.app
        PRODUCT_NAME: AnHongJiang
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode 16 默认把主代码放进 AnHongJiang.debug.dylib，主二进制只剩壳。
        # 自签安装时 rpath 解析不到这个 dylib 会直接闪退，所以必须关掉。
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LDFLAGS: "-ObjC"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
