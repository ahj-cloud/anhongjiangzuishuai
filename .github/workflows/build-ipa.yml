name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project AnHongJiang.xcodeproj \
            -scheme AnHongJiang \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/AnHongJiang.app out/Payload/
          cd out
          zip -qry AnHongJiang-unsigned.ipa Payload
          ls -lh AnHongJiang-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AnHongJiang-unsigned-ipa
          path: out/AnHongJiang-unsigned.ipa
